name: Build and Push ARM64 Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # 支持在 GitHub 页面上手动点击触发

jobs:
  build-arm64:
    # 使用 GitHub 原生 64 位 ARM runner，速度最快
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write # 必须赋予向 ghcr.io 推送镜像的写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 关键步骤：将包含大写的 GitHub 用户名/仓库名自动转为纯小写
      - name: Normalize repository name to lowercase
        id: repo_name
        run: |
          LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${LOWERCASE_REPO}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 使用前序步骤生成的纯小写镜像前缀
          images: ${{ steps.repo_name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 Actions 缓存加速下一次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
